[versions]
# Android SDK levels shared by the modules. compileSdk 37 because current
# AndroidX/Compose releases require it; the apps still target 36.
compileSdk = "37"
targetSdk = "36"
phoneMinSdk = "34"
wearMinSdk = "33"
buildTools = "36.1.0"   # must match tools/builder/Dockerfile

agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
wearCompose = "1.7.1"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
coroutines = "1.11.0"
cronet = "500.1.0"      # bundles Chromium 155.0.8059.16
serialization = "1.12.0"
datastore = "1.3.0"
browser = "1.10.0"
navigation3 = "1.2.0"
junit = "4.13.2"
# The phone–watch link and the watch app (Phase 19)
playServicesWearable = "20.0.1"
wearTiles = "1.6.2"
wearProtolayout = "1.4.2"
wearComplications = "1.3.0"
work = "2.12.0"
# Push (P18-05): the UnifiedPush connector decrypts Web Push; the embedded
# FCM distributor registers with Play services using the server's VAPID key,
# so no Firebase project of ours and no gateway.
unifiedpush = "3.3.5"
unifiedpushEmbeddedFcm = "3.1.0"
glance = "1.2.0"
# The watch setup (P19-06): the phone is the ADB client for the one-time
# install on the watch. libadb-android (JitPack, Apache-2.0 of its dual
# GPL-3.0-or-later/Apache-2.0 licence) needs a Conscrypt with TLS 1.3 key
# export for pairing, and BouncyCastle; bcpkix (the self-signed certificate of
# the phone's ADB key) is pinned to the BouncyCastle version libadb 3.1.1 is
# built against.
libadb = "3.1.1"
conscrypt = "2.9.0"
bouncycastle = "1.86"

# Build tools only, never in an APK (SEC-APP). AGP 9.5.1, the newest 9.x,
# brings these libraries in versions with security advisories, on its own
# classpath (the root project's buildscript classpath) and on lint's (each
# module's androidLintTool). The root build.gradle.kts turns the
# build-tool-floors bundle below into dependency constraints on those two
# classpaths only: floors, so a newer version that AGP asks for still wins.
# Drop an entry once AGP brings that version or a newer one by itself
# (./gradlew buildEnvironment, :phone:dependencies --configuration androidLintTool).
buildToolsBouncycastle = "1.86"   # was 1.80.2 (sdk-common): GHSA-9pwp-9qqc-pr26 and GHSA-qp49-qgx5-5m26 (bcprov, fixed in 1.85), GHSA-wg6q-6289-32hp (bcpkix, 1.84); the apps' own BouncyCastle version
buildToolsGuava = "33.8.0-jre"    # was 33.4.0-jre: GHSA-xxph-c9ww-hj94
buildToolsJose4j = "0.9.7"        # was 0.9.5 (bundletool 1.18.3): GHSA-3677-xxcr-wjqv
buildToolsJdom2 = "2.0.6.1"       # was 2.0.6 (jetifier-processor 1.0.0-beta10): GHSA-2363-cqg2-863c
buildToolsCommonsLang3 = "3.21.0" # was 3.16.0 (commons-compress 1.27.1): GHSA-j288-q9x7-2f5v
buildToolsHttpclient = "4.5.14"   # was 4.5.6 on lint's classpath (httpmime 4.5.6): GHSA-7r82-7xv7-xcpj; AGP's own classpath already resolves 4.5.14

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }

wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Wear OS Data Layer (MessageClient, ChannelClient, CapabilityClient)
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }

wear-compose-navigation = { module = "androidx.wear.compose:compose-navigation", version.ref = "wearCompose" }
wear-tiles = { module = "androidx.wear.tiles:tiles", version.ref = "wearTiles" }
wear-protolayout = { module = "androidx.wear.protolayout:protolayout", version.ref = "wearProtolayout" }
wear-protolayout-material3 = { module = "androidx.wear.protolayout:protolayout-material3", version.ref = "wearProtolayout" }
wear-complications-data-source-ktx = { module = "androidx.wear.watchface:watchface-complications-data-source-ktx", version.ref = "wearComplications" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
# Custom Tabs: the Dashboard opens in the default browser (Firefox, Chrome, …), which holds the Access login.
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
unifiedpush-connector = { module = "org.unifiedpush.android:connector", version.ref = "unifiedpush" }
unifiedpush-embedded-fcm-distributor = { module = "org.unifiedpush.android:embedded-fcm-distributor", version.ref = "unifiedpushEmbeddedFcm" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
libadb-android = { module = "com.github.MuntashirAkon:libadb-android", version.ref = "libadb" }
conscrypt-android = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk15to18", version.ref = "bouncycastle" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk15to18", version.ref = "bouncycastle" }

# Embedded Cronet: the whole Chromium network stack inside the APK
# (cronet-embedded is now an empty alias of cronet-bundled).
cronet-bundled = { module = "org.chromium.net:cronet-bundled", version.ref = "cronet" }

junit = { module = "junit:junit", version.ref = "junit" }

# Build-tool floors (SEC-APP, see [versions]): constraints on AGP's and lint's
# classpaths only, never dependencies of the apps.
buildtools-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "buildToolsBouncycastle" }
buildtools-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "buildToolsBouncycastle" }
buildtools-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "buildToolsBouncycastle" }
buildtools-guava = { module = "com.google.guava:guava", version.ref = "buildToolsGuava" }
buildtools-jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "buildToolsJose4j" }
buildtools-jdom2 = { module = "org.jdom:jdom2", version.ref = "buildToolsJdom2" }
buildtools-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "buildToolsCommonsLang3" }
buildtools-httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "buildToolsHttpclient" }

[bundles]
build-tool-floors = [
    "buildtools-bcprov", "buildtools-bcpkix", "buildtools-bcutil", "buildtools-guava",
    "buildtools-jose4j", "buildtools-jdom2", "buildtools-commons-lang3", "buildtools-httpclient",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
