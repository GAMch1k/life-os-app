name: Bug report
description: Something in the phone or watch app doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A security problem is never reported here: see [SECURITY.md](https://github.com/GAMch1k/life-os-app/blob/main/SECURITY.md). Problems with the server or the Dashboard belong in [life-os](https://github.com/GAMch1k/life-os/issues/new/choose).
        Remove service tokens, keys, and personal data from everything you paste.
  - type: input
    id: version
    attributes:
      label: Version
      description: The app's version (Android Settings › Apps › Life OS) or the commit you built from, and the phone or watch model with its Android or Wear OS version.
      placeholder: 0.4.5 on a Galaxy Watch 8, Wear OS 6
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what the app did. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The message the app shows, or `adb logcat`. Remove service tokens, keys, and personal data first.
      render: text
