# Weekly version updates (X-09): the Gradle dependencies (the version catalog,
# the plugins), and the actions .github/workflows/ci.yml pins by commit SHA.
# Minor and patch updates come grouped, one pull request per ecosystem, and
# CI tests each one. No ecosystem gets major versions (the owner's decision,
# 2026-11-10, as in life-os): a major upgrade is a ticket of its own. The
# ignore rules apply to version updates only; security updates still come.
#
# Not covered, so raised by hand: the SDK levels and buildTools in
# gradle/libs.versions.toml, and the JDK, command-line tools and SDK packages
# tools/builder/Dockerfile pins (buildTools must match the Dockerfile).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    # No majors (owner's decision, 2026-11-10); a major upgrade is a ticket.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    # No majors (owner's decision, 2026-11-10); a major upgrade is a ticket.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
