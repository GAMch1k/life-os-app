# The build runs on a small shared host (see tools/build): one short-lived
# Gradle JVM with a bounded heap, Kotlin compiled inside it, two workers.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
