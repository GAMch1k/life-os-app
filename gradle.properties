# The build runs on a small shared host (see tools/build): one short-lived
# Gradle JVM per step with a bounded heap, Kotlin compiled inside it, two
# workers (tools/builder/in-container assembles each app with one).
# The heap: the serial collector, told to keep 20-40 % of it free, holds it
# near what the build really uses (R8's peak live data is about 550 MiB);
# the parallel collector grew it towards -Xmx, which stays as the ceiling.
# Both took the same time on two CPUs.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -XX:MinHeapFreeRatio=20 -XX:MaxHeapFreeRatio=40 -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
# Unit tests for the release variant too (AGP 9 makes them for debug only):
# tools/build tests the classes the APKs are built from, so nothing is
# compiled twice.
android.onlyEnableUnitTestForTheTestedBuildType=false
