# The one version of the Life OS apps; the phone and wear APKs share it.
#
# versionName: semantic version (MAJOR.MINOR.PATCH), what people read.
# versionCode: the number Android compares on install. Add 1 for every
#              release that is published (dist/ -> /android/updates), never
#              reuse or decrease it: Android refuses to install a lower code
#              over a higher one.
versionName=0.3.2
versionCode=5
